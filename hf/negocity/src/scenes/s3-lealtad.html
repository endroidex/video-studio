  <script>
    (function () {
      /*@T@*/
      const tl = gsap.timeline({ paused: true });
      const $ = (s) => document.querySelector(s);
      // entrada
      tl.fromTo("#s3-rings", { rotation: 0 }, { rotation: 14, duration: DUR, ease: "none" }, 0);
      rise(tl, "#s3-chip", 0.02, { x: 160, y: 0, d: 0.45 });
      blurIn(tl, ".s3-w", 0.08, 0.08, 0.26);
      tl.fromTo("#s3-ph", { opacity: 0, x: 220, y: 240, rotation: 7 }, { opacity: 1, x: 0, y: 0, rotation: 0, duration: 0.65, ease: "expo.out" }, 0.05);
      tl.fromTo("#s3-stamps", { opacity: 0, scale: 0.95, x: 300, rotation: 5 }, { opacity: 1, scale: 1, x: 0, rotation: 0, duration: 0.6, ease: "expo.out" }, 0.2);
      for (let i = 1; i <= 5; i++) tl.fromTo("#s3-f" + i, { scale: 0 }, { scale: 1, duration: 0.32, ease: "back.out(2)" }, 0.42 + i * 0.05);
      [6, 7, 8].forEach((i) => tl.set("#s3-f" + i, { scale: 0 }, 0));
      tl.fromTo("#s3-sweep", { x: -400, opacity: 0.8, rotation: 18 }, { x: 1300, opacity: 0.8, rotation: 18, duration: 0.8, ease: "power1.inOut" }, 0.15);

      // "juntan visitas" → el empleado escanea el QR
      const tS = W("3", 2) - 0.3, tV = W("3", 3) + 0.12;
      tl.fromTo("#s3-scan", { opacity: 0, x: 620, y: 260, rotation: 26 }, { opacity: 1, x: 0, y: 0, rotation: -7, duration: 0.45, ease: "power4.out" }, tS);
      tl.fromTo("#s3-sok", { opacity: 0, scale: 0.8 }, { opacity: 0, scale: 0.8, duration: 0.01 }, 0);
      tl.fromTo("#s3-line", { y: 0 }, { y: 196, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 1 }, tS + 0.3);
      tl.to("#s3-line, #s3-slabel", { opacity: 0, duration: 0.1 }, tV - 0.02);
      tl.to("#s3-sok", { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, tV);
      // sello 6 + contador
      const stamp = (i, t) => { tl.to("#s3-f" + i, { scale: 1, duration: 0.4, ease: "back.out(2.6)" }, t); tl.set("#s3-cnt", { textContent: String(i) }, t + 0.05); tl.fromTo("#s3-cnt", { scale: 1.5 }, { scale: 1, duration: 0.3, ease: "power2.out", display: "inline-block" }, t + 0.05); };
      stamp(6, tV + 0.08);
      // "o puntos"
      const tPt = W("3", 5) - 0.05, pt = { v: 120 }, ptn = $("#s3-ptn");
      tl.fromTo("#s3-toast", { opacity: 0, scale: 0.6, y: 50 }, { opacity: 1, scale: 1, y: 0, duration: 0.35, ease: "back.out(2)" }, tPt);
      tl.to(pt, { v: 130, duration: 0.4, ease: "power1.out", onUpdate: () => (ptn.textContent = Math.round(pt.v)) }, tPt + 0.1);
      tl.to("#s3-toast", { opacity: 0, y: -70, duration: 0.3, ease: "power2.in" }, tPt + 0.75);
      // "con una tarjeta digital en su celular" → se va el escáner, acercamiento a la tarjeta
      const tC = W("3", 6) - 0.05;
      tl.to("#s3-scan", { x: 700, y: 320, rotation: 24, opacity: 0, duration: 0.34, ease: "power3.in" }, tC);
      tl.to("#s3-cam", { scale: 1.06, duration: 0.9, ease: "power2.inOut", transformOrigin: "420px 860px" }, tC + 0.1);
      tl.fromTo("#s3-qrsheen", { x: 0, opacity: 1, rotation: 16 }, { x: 460, opacity: 1, rotation: 16, duration: 0.55, ease: "power1.inOut" }, W("3", 8));
      stamp(7, W("3", 10) - 0.02);
      const tR = W("3", 13) - 0.12;           // "…y siempre regresan" → premio
      stamp(8, tR - 0.3);
      tl.fromTo("#s3-reward", { opacity: 0, scale: 0.5, y: 60, rotation: -6 }, { opacity: 1, scale: 1, y: 0, rotation: 0, duration: 0.5, ease: "back.out(1.8)" }, tR);
      const rays = $("#s3-rays");
      for (let i = 0; i < 14; i++) {
        const r = document.createElement("div"); r.className = "s3-ray"; rays.appendChild(r);
        const a = (i / 14) * Math.PI * 2 + rng() * 0.3, d = 250 + rng() * 150;
        tl.fromTo(r, { x: Math.cos(a) * 120, y: Math.sin(a) * 60, scale: 0, opacity: 1 }, { x: Math.cos(a) * d, y: Math.sin(a) * d * 0.62, scale: 1 + rng(), opacity: 0, duration: 0.7 + rng() * 0.3, ease: "power2.out" }, tR + 0.05);
      }
      [["#s3-sp0", 0.2], ["#s3-sp1", 0.38]].forEach(([s, d]) => {
        tl.fromTo(s, { scale: 0, rotation: -40 }, { scale: 1, rotation: 0, duration: 0.22, ease: "back.out(2.5)" }, tR + d);
        tl.to(s, { scale: 0, rotation: 40, duration: 0.3, ease: "power2.in" }, tR + d + 0.4);
      });
      tl.fromTo("#s3-reward .gi", { rotation: 0 }, { rotation: -10, duration: 0.09, yoyo: true, repeat: 5, ease: "sine.inOut" }, tR + 0.45);
      // salida
      tl.to("#s3-all", { x: -300, opacity: 0, filter: "blur(18px)", duration: 0.25, ease: "power3.in" }, DUR - 0.27);
      window.__timelines["s3-lealtad"] = tl;
    })();
  </script>
