      const rng=(a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296})(SEED);

      const tl = gsap.timeline({ paused: true });
      const rot = { "s1-lo1": 7, "s1-lo2": -9, "s1-lo3": 6, "s1-lo4": -12, "s1-lo5": 12, "s1-rec2": -13, "s1-sheet": 5, "s1-st1": -8, "s1-note": -6, "s1-st2": 11, "s1-rec1": 8, "s1-ch1": -3, "s1-ch2": 4, "s1-ch3": -2, "s1-ch4": 3 };
      // estado inicial (frame 0 = miniatura): mesa ya desordenada + gancho
      ["s1-lo1", "s1-lo2", "s1-lo3", "s1-lo4", "s1-lo5", "s1-rec2", "s1-sheet", "s1-st1"].forEach((id) => tl.set("#" + id, { rotation: rot[id] }, 0));
      tl.fromTo("#s1-title", { opacity: 1 }, { opacity: 1, duration: 0.01 }, 0);
      tl.fromTo("#s1-pile", { scale: 1.06 }, { scale: 1, duration: 1.2, ease: "power2.out", transformOrigin: "540px 820px" }, 0);

      // "libretas" → cae la libreta; "chats" → estallan los chats; "hojas sueltas" → vuelan recibos
      const tLib = W("0", 4) - 0.12, tChat = W("0", 5) - 0.1, tHoj = W("0", 7) - 0.1;
      tl.fromTo("#s1-note", { opacity: 0, y: -420, x: -160, rotation: -24, scale: 1.25 }, { opacity: 1, y: 0, x: 0, rotation: rot["s1-note"], scale: 1, duration: 0.5, ease: "expo.out" }, tLib);
      tl.fromTo("#s1-st2", { opacity: 0, y: -300, rotation: 40 }, { opacity: 1, y: 0, rotation: rot["s1-st2"], duration: 0.45, ease: "expo.out" }, tLib + 0.1);
      ["s1-ch1", "s1-ch2", "s1-ch3", "s1-ch4"].forEach((id, i) =>
        tl.fromTo("#" + id, { opacity: 0, scale: 0.5, rotation: rot[id] * 3, y: 60 }, { opacity: 1, scale: 1, rotation: rot[id], y: 0, duration: 0.42, ease: "back.out(1.7)", transformOrigin: i % 2 ? "0% 100%" : "100% 100%" }, tChat + i * 0.09));
      tl.fromTo("#s1-rec1", { opacity: 0, x: 520, y: -240, rotation: 50 }, { opacity: 1, x: 0, y: 0, rotation: rot["s1-rec1"], duration: 0.5, ease: "expo.out" }, tHoj);
      // el desorden nunca se queda quieto
      Object.keys(rot).forEach((id, i) => {
        const cyc = 0.34 + (i % 4) * 0.07, t0 = 1.0 + (i % 5) * 0.11;
        tl.to("#" + id, { x: "+=" + (i % 2 ? 7 : -6), y: "+=" + (i % 3 ? -5 : 6), rotation: "+=" + (i % 2 ? 1.4 : -1.6), duration: cyc, ease: "sine.inOut", yoyo: true, repeat: Math.max(1, Math.floor((LS("1") - t0) / cyc)) }, Math.max(t0, tHoj + 0.55));
      });

      // ── tres dolores
      const tP = [W("1", 0) - 0.16, W("1", 4) - 0.16, W("1", 8) - 0.16], tEnd = LE("1") + 0.12;
      tl.to("#s1-pile", { opacity: 0.22, scale: 0.9, filter: "blur(7px)", duration: 0.35, ease: "power2.inOut" }, tP[0] - 0.1);
      tl.to("#s1-title", { opacity: 0, filter: "blur(12px)", x: -60, duration: 0.2, ease: "power2.in" }, tP[0] - 0.12);
      const ins = [{ x: 220, y: 0, scale: 1 }, { x: 0, y: 160, scale: 0.92 }, { x: 0, y: -180, scale: 1 }];
      ["#s1-p1", "#s1-p2", "#s1-p3"].forEach((sel, i) => {
        tl.fromTo(sel, { opacity: 0, filter: "blur(16px)", ...ins[i] }, { opacity: 1, filter: "blur(0px)", x: 0, y: 0, scale: 1, duration: 0.38, ease: "power4.out" }, tP[i]);
        if (i < 2) tl.to(sel, { opacity: 0, filter: "blur(12px)", x: -140, duration: 0.18, ease: "power3.in" }, tP[i + 1] - 0.16);
      });
      // 1 · los clientes se van
      [4, 3, 2, 1].forEach((n, k) => {
        const t = W("1", 2) + k * 0.1;
        tl.to("#s1-a" + n, { backgroundColor: "rgba(255,254,250,0)", color: "rgba(255,254,250,.45)", boxShadow: "0 0 0 rgba(0,0,0,0)", borderColor: "rgba(255,254,250,.45)", y: -18, duration: 0.22, ease: "power2.out" }, t);
      });
      tl.fromTo("#s1-p1c", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, tP[0] + 0.12);
      // 2 · los números bailan y no coinciden
      const n1 = document.querySelector("#s1-n1"), n2 = document.querySelector("#s1-n2");
      const fmt = (v) => "$" + Math.round(v).toLocaleString("en-US");
      const o1 = { v: 4100 }, o2 = { v: 5100 };
      tl.to(o1, { v: 4820, duration: 0.6, ease: "power2.out", onUpdate: () => (n1.textContent = fmt(o1.v)) }, tP[1] + 0.05);
      tl.to(o2, { v: 4350, duration: 0.6, ease: "power2.out", onUpdate: () => (n2.textContent = fmt(o2.v)) }, tP[1] + 0.05);
      tl.fromTo("#s1-neq", { scale: 0, rotation: -90 }, { scale: 1, rotation: 0, duration: 0.4, ease: "back.out(2)" }, W("1", 6) - 0.05);
      tl.fromTo("#s1-p2c", { opacity: 0, y: 40, scale: 0.95 }, { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: "expo.out" }, tP[1] + 0.14);
      // 3 · se busca… y nada
      const typed = document.querySelector("#s1-typed"), q = "proveedor de pan", ty = { n: 0 };
      tl.to(ty, { n: q.length, duration: 0.55, ease: "none", onUpdate: () => (typed.textContent = q.slice(0, Math.round(ty.n))) }, tP[2] + 0.12);
      tl.fromTo("#s1-p3c", { opacity: 0, y: -40, scale: 0.95 }, { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: "expo.out" }, tP[2] + 0.5);

      // ── todo el desorden se aspira hacia un punto de luz
      tl.to("#s1-cam", { scale: 0.02, rotation: 28, filter: "blur(14px)", duration: 0.46, ease: "power3.in", transformOrigin: "540px 760px" }, tEnd);
      tl.to("#s1-pile", { opacity: 0.9, duration: 0.2 }, tEnd);
      tl.to("#s1-cam", { opacity: 0, duration: 0.1 }, tEnd + 0.38);
      tl.fromTo("#s1-spark", { opacity: 0, scale: 0.2 }, { opacity: 1, scale: 1, duration: 0.22, ease: "power2.out" }, tEnd + 0.3);
      window.__timelines["s1-caos"] = tl;
    })();
  </script>
