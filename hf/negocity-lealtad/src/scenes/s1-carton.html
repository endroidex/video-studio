<template>

  <script>
    (function () {
      /*@T@*/
      const tl = gsap.timeline({ paused: true });
      // frame 0 (miniatura): la tarjeta de cartón ya está en pantalla con el título
      tl.fromTo("#s1-cam", { scale: 1.0 }, { scale: 1.12, duration: DUR - 0.5, ease: "none", transformOrigin: "540px 1110px" }, 0);
      tl.fromTo(".s1-a", { opacity: 1 }, { opacity: 1, duration: 0.01 }, 0);
      // frame 0 ya muestra la pregunta completa (miniatura); "basura" se resalta cuando se dice
      tl.fromTo(".s1-b", { opacity: 1 }, { opacity: 1, duration: 0.01 }, 0);
      tl.fromTo("#s1-title .hl-green", { scale: 1 }, { scale: 1.12, duration: 0.14, yoyo: true, repeat: 1, ease: "power2.out", transformOrigin: "0% 60%" }, W("0", 9) - 0.04);

      const tB = W("0", 9) - 0.04;
      tl.to("#s1-photo", { filter: "saturate(0.15) brightness(0.62)", duration: 0.35, ease: "power2.out" }, tB);
      tl.fromTo("#s1-x", { opacity: 0, scale: 0.4, rotation: -60 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.32, ease: "back.out(2)" }, tB + 0.04);

      const tT = DUR - 0.55;
      tl.to("#s1-title, #s1-x", { opacity: 0, filter: "blur(14px)", duration: 0.2, ease: "power2.in" }, tT);

      tl.to("#s1-cam", { scale: 2.6, filter: "blur(10px)", duration: 0.5, ease: "power3.in", transformOrigin: "540px 1110px" }, tT + 0.05);
      tl.fromTo("#s1-flash", { opacity: 0 }, { opacity: 1, duration: 0.16, ease: "power2.in" }, DUR - 0.16);
      window.__timelines["s1-carton"] = tl;
    })();
